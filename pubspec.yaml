name: chroma_folio
description: Perceptual Color Studio — HSLuv, OKLCH, and HCT interactive picker and comparison tool.
version: 2.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  hsluv: ^1.1.3
  material_color_utilities: ^0.13.0
  google_fonts: ^9.0.0
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  url_launcher: ^6.3.3
  cupertino_ui: ^1.1.7
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/colornames.json
